name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Code ophalen
        uses: actions/checkout@v4

      - name: Python installeren
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test-tools installeren
        run: pip install pytest pytest-cov

      - name: Unit tests draaien met coverage
        # test_get_all_endpoints.py slaan we over: duurt tering lang
        run: python -m pytest tests -v --ignore=tests/test_get_all_endpoints.py --cov=v2/api/models --cov-report=term-missing
